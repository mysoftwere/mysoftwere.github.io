<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySoftwere Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.container{max-width:1100px;margin:35px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #00000012}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:8px;margin:6px 0 12px;font-size:15px}textarea{min-height:90px}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600;margin:4px}.primary{background:#1769ff;color:#fff}.secondary{background:#eef2f7}.danger{background:#e53935;color:#fff}.hidden{display:none}.login{max-width:450px;margin:90px auto}.small{font-size:13px;color:#687386}.item{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #e1e6ee;border-radius:10px;margin:9px 0;background:#fafbfd}.handle{cursor:grab;font-size:20px}.item.dragging{opacity:.45;border:2px dashed #1769ff}.info{flex:1}.name{font-weight:700;font-size:17px}.meta{font-size:13px;color:#697386;margin-top:4px}.actions{white-space:nowrap}#status{padding:10px;border-radius:8px;margin:10px 0;display:none}@media(max-width:700px){.item{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}}
</style></head><body>
<div id="loginBox" class="card login"><h1>MySoftwere Admin</h1><p class="small">Admin password দিয়ে প্রবেশ করুন।</p><input id="loginPassword" type="password" placeholder="Admin Password"><button class="primary" onclick="login()">Login</button><div id="loginStatus"></div></div>
<div id="app" class="container hidden">
<div class="card"><h1>MySoftwere Admin Panel</h1><button class="secondary" onclick="loadSoftware()">Refresh</button><button class="secondary" onclick="logout()">Logout</button><div id="status"></div></div>
<div class="card"><h2 id="formTitle">Add Software</h2><input id="name" placeholder="Software Name"><input id="url" placeholder="Software URL"><select id="category"><option value="utility">Utility</option><option value="html">HTML</option><option value="tool">Tool</option><option value="software">Software</option><option value="other">Other</option></select><textarea id="description" placeholder="Description"></textarea><label>Position Number</label><input id="position" type="number" min="1" placeholder="Example: 1"><button id="saveBtn" class="primary" onclick="saveSoftware()">Add Software</button><button id="cancelBtn" class="secondary hidden" onclick="clearForm()">Cancel Edit</button></div>
<div class="card"><h2>Software List</h2><p class="small">Position number দিয়ে সাজাতে পারবেন অথবা ধরে টেনে সাজিয়ে Save Order চাপতে পারবেন।</p><div id="list">Loading...</div><button class="primary" onclick="saveOrder()">Save Order</button></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxeD6VqiZPxx4q0_y7WzxBDQta2z9Vd7w3h0nnSSBq59rTV308BfTO2kv-PUi6g9Adx/exec";
const ADMIN_PASSWORD="Freefire645268756625800";let software=[],editingId=null;const $=id=>document.getElementById(id);
function showStatus(m,ok=true){let e=$("status");e.textContent=m;e.style.display="block";e.style.background=ok?"#e9f8ee":"#fdecec";e.style.color=ok?"#146c2e":"#a51d2d"}
function request(params){return new Promise((resolve,reject)=>{let cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),q=new URLSearchParams({...params,password:ADMIN_PASSWORD,callback:cb,_:Date.now()}),t=setTimeout(()=>{cleanup();reject(Error("Server timeout"))},15000);window[cb]=d=>{clearTimeout(t);cleanup();resolve(d)};function cleanup(){delete window[cb];s.remove()}s.onerror=()=>{clearTimeout(t);cleanup();reject(Error("Apps Script connection failed"))};s.src=API_URL+"?"+q.toString();document.body.appendChild(s)})}
async function loadSoftware(){try{let d=await request({});software=Array.isArray(d)?d:[];renderList()}catch(e){showStatus("Load failed: "+e.message,false)}}
function renderList(){let l=$("list");l.innerHTML="";if(!software.length){l.innerHTML="<p>No software found.</p>";return}software.forEach((x,i)=>{let r=document.createElement("div");r.className="item";r.draggable=true;r.dataset.id=x.id;r.innerHTML=`<div class="handle">☰</div><div class="info"><div class="name">${esc(x.name)}</div><div class="meta">Position: ${x.position} · ${esc(x.category||"utility")} · ${esc(x.url)}</div><div class="small">${esc(x.description||"")}</div></div><div class="actions"><button class="secondary" data-up>↑</button><button class="secondary" data-down>↓</button><button class="primary" data-edit>Edit</button><button class="danger" data-delete>Delete</button></div>`;r.querySelector("[data-up]").onclick=()=>moveItem(i,-1);r.querySelector("[data-down]").onclick=()=>moveItem(i,1);r.querySelector("[data-edit]").onclick=()=>editItem(x.id);r.querySelector("[data-delete]").onclick=()=>deleteItem(x.id);r.addEventListener("dragstart",()=>r.classList.add("dragging"));r.addEventListener("dragend",()=>r.classList.remove("dragging"));r.addEventListener("dragover",e=>{e.preventDefault();let d=document.querySelector(".dragging");if(!d||d===r)return;let after=e.clientY>r.getBoundingClientRect().top+r.getBoundingClientRect().height/2;r.parentNode.insertBefore(d,after?r.nextSibling:r)});l.appendChild(r)})}
function moveItem(i,d){let n=i+d;if(n<0||n>=software.length)return;[software[i],software[n]]=[software[n],software[i]];renderList()}
async function saveOrder(){let ids=[...document.querySelectorAll(".item")].map(x=>x.dataset.id);try{let r=await request({action:"reorder",ids:JSON.stringify(ids)});if(!r.success)throw Error(r.error);showStatus("Order saved.");await loadSoftware()}catch(e){showStatus(e.message,false)}}
async function saveSoftware(){let name=$("name").value.trim(),url=$("url").value.trim(),position=Number($("position").value);if(!name||!url){showStatus("Name এবং URL দিতে হবে।",false);return}if(!position||position<1){showStatus("Position number দিন।",false);return}let p={name,url,category:$("category").value,description:$("description").value.trim(),position};try{let r;if(editingId)r=await request({action:"edit",id:editingId,...p});else{p.id=makeId(name);r=await request({action:"add",...p})}if(!r.success)throw Error(r.error||"Save failed");showStatus(editingId?"Software updated successfully.":"Software added successfully.");clearForm();await loadSoftware()}catch(e){showStatus(e.message,false)}}
function editItem(id){let x=software.find(a=>String(a.id)===String(id));if(!x)return;editingId=id;$("formTitle").textContent="Edit Software";$("saveBtn").textContent="Update Software";$("cancelBtn").classList.remove("hidden");$("name").value=x.name||"";$("url").value=x.url||"";$("category").value=x.category||"utility";$("description").value=x.description||"";$("position").value=x.position||1;scrollTo({top:0,behavior:"smooth"})}
async function deleteItem(id){let x=software.find(a=>String(a.id)===String(id));if(!x||!confirm("Delete '"+x.name+"' ?"))return;try{let r=await request({action:"delete",id});if(!r.success)throw Error(r.error);showStatus("Software deleted.");await loadSoftware()}catch(e){showStatus(e.message,false)}}
function clearForm(){editingId=null;$("formTitle").textContent="Add Software";$("saveBtn").textContent="Add Software";$("cancelBtn").classList.add("hidden");["name","url","description","position"].forEach(id=>$(id).value="");$("category").value="utility"}
function makeId(n){return n.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")+"_"+Date.now()}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function login(){if($("loginPassword").value===ADMIN_PASSWORD){sessionStorage.setItem("mysoftwere_admin_login","1");$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");loadSoftware()}else{$("loginStatus").textContent="Wrong password"}}function logout(){sessionStorage.removeItem("mysoftwere_admin_login");location.reload()}window.addEventListener("load",()=>{if(sessionStorage.getItem("mysoftwere_admin_login")==="1"){$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");loadSoftware()}});
</script></body></html>
