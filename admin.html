<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySoftwere Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
.wrap{max-width:1000px;margin:30px auto;padding:20px}.card{background:#fff;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 15px rgba(0,0,0,.07)}
h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
textarea{min-height:90px}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:6px}
button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:bold;margin:3px}
.primary{background:#2563eb;color:#fff}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.gray{background:#6b7280;color:#fff}
.status{padding:10px;border-radius:8px;margin:10px 0;display:none}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}
.item{display:flex;align-items:center;gap:12px;padding:13px;margin:8px 0;background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px}
.info{flex:1}.name{font-weight:bold;font-size:16px}.meta{font-size:12px;color:#6b7280;margin-top:3px}.drag{font-size:20px;color:#999}.actions{white-space:nowrap}
@media(max-width:700px){.grid{grid-template-columns:1fr}.item{align-items:flex-start}.actions{white-space:normal}}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:430px;margin:80px auto">
<h1>MySoftwere Admin</h1>
<p>Admin password দিন।</p>
<input id="pw" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login</button>
<div id="loginMsg" class="status"></div>
</div>

<div id="app" style="display:none">
<div class="wrap">
<div class="card">
<h1>MySoftwere Admin Panel</h1>
<div id="msg" class="status"></div>
<div class="grid">
<div class="field"><label>Name</label><input id="name" placeholder="Software name"></div>
<div class="field"><label>URL</label><input id="url" placeholder="https://example.com"></div>
<div class="field"><label>Category</label>
<select id="category"><option value="html">HTML</option><option value="software">Software</option><option value="tool">Online Tool</option><option value="app">App</option><option value="game">Game</option><option value="other">Other</option></select></div>
<div class="field"><label>Description</label><input id="description" placeholder="Short description"></div>
</div>
<button id="save" class="success" onclick="save()">Add Software</button>
<button id="cancel" class="gray" onclick="cancelEdit()" style="display:none">Cancel</button>
</div>

<div class="card">
<h2>Software List</h2>
<p>☰ ধরে drag করে position বদলান, তারপর Save Position চাপুন।</p>
<button class="primary" onclick="load()">Refresh</button>
<button class="primary" onclick="saveOrder()">Save Position</button>
<div id="list">Loading...</div>
</div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxeD6VqiZPxx4q0_y7WzxBDQta2z9Vd7w3h0nnSSBq59rTV308BfTO2kv-PUi6g9Adx/exec";
const ADMIN_PASSWORD="Freefire645268756625800";
let password=ADMIN_PASSWORD,items=[],editId=null,dragged=null;

function msg(t,e=false){let x=document.getElementById("msg");x.textContent=t;x.className="status "+(e?"err":"ok");setTimeout(()=>x.className="status",3500)}
function login(){if(document.getElementById("pw").value!==ADMIN_PASSWORD){let x=document.getElementById("loginMsg");x.textContent="Wrong password";x.className="status err";return}document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load()}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

function getData(){return new Promise((resolve,reject)=>{let cb="cb_"+Date.now();let s=document.createElement("script");window[cb]=d=>{delete window[cb];s.remove();resolve(Array.isArray(d)?d:[])};s.onerror=()=>{delete window[cb];s.remove();reject(new Error("Connection failed"))};s.src=API_URL+"?callback="+cb+"&_="+Date.now();document.body.appendChild(s)})}
async function load(){try{items=await getData();render()}catch(e){msg("Google Apps Script connection failed",true)}}

function render(){let l=document.getElementById("list");if(!items.length){l.innerHTML="<p>No software found.</p>";return}l.innerHTML="";items.forEach(x=>{let d=document.createElement("div");d.className="item";d.draggable=true;d.dataset.id=x.id;d.innerHTML='<div class="drag">☰</div><div class="info"><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(x.category||"")+" • "+esc(x.url||"")+'</div><div class="meta">'+esc(x.description||"")+'</div></div><div class="actions"><button class="primary" onclick="edit(\''+js(x.id)+'\')">Edit</button><button class="danger" onclick="del(\''+js(x.id)+'\')">Delete</button></div>';d.addEventListener("dragstart",()=>{dragged=d;d.style.opacity=.5});d.addEventListener("dragend",()=>{d.style.opacity=1;dragged=null});d.addEventListener("dragover",e=>{e.preventDefault();if(!dragged||dragged===d)return;if([...l.children].indexOf(dragged)<[...l.children].indexOf(d))l.insertBefore(dragged,d.nextSibling);else l.insertBefore(dragged,d)});l.appendChild(d)})}

function post(p){return fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...p,password})}).then(()=>new Promise(r=>setTimeout(r,700)))}
async function save(){let name=v("name"),url=v("url"),category=v("category"),description=v("description");if(!name||!url)return msg("Name and URL are required",true);try{if(editId)await post({action:"edit",id:editId,item:{name,url,category,description}});else await post({action:"add",item:{id:slug(name)+"-"+Date.now(),name,url,category,description}});msg(editId?"Updated successfully":"Added successfully");cancelEdit();load()}catch(e){msg("Save failed",true)}}
function edit(id){let x=items.find(a=>String(a.id)===String(id));if(!x)return;editId=id;document.getElementById("name").value=x.name||"";document.getElementById("url").value=x.url||"";document.getElementById("category").value=x.category||"html";document.getElementById("description").value=x.description||"";document.getElementById("save").textContent="Update Software";document.getElementById("cancel").style.display="inline-block";scrollTo({top:0,behavior:"smooth"})}
function cancelEdit(){editId=null;["name","url","description"].forEach(id=>document.getElementById(id).value="");document.getElementById("category").value="html";document.getElementById("save").textContent="Add Software";document.getElementById("cancel").style.display="none"}
async function del(id){let x=items.find(a=>String(a.id)===String(id));if(!x||!confirm("Delete "+x.name+"?"))return;try{await post({action:"delete",id});msg("Deleted successfully");load()}catch(e){msg("Delete failed",true)}}
async function saveOrder(){let ids=[...document.querySelectorAll(".item")].map(x=>x.dataset.id);try{await post({action:"reorder",ids});msg("Position saved");load()}catch(e){msg("Position save failed",true)}}
function v(id){return document.getElementById(id).value.trim()}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"software"}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function js(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"')}
</script>
</body>
</html>
